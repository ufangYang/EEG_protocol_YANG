<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EEG Study Protocol</title>
<style>
  :root { --line:#e3e3e6; --muted:#666; --accent:#2b5bd7; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Roboto,sans-serif; color:#1a1a1a;
         max-width:900px; margin:0 auto; padding:24px 18px 60px; line-height:1.4; }
  h1 { margin:0 0 2px; font-size:22px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  fieldset { border:1px solid var(--line); border-radius:8px; margin:0 0 14px; padding:12px 16px 16px;
             background:#f7f7f8; }
  legend { font-weight:600; padding:0 6px; }
  label { display:block; font-size:14px; margin:10px 0 3px; }
  input[type=text], input[type=number], textarea, select {
     width:100%; padding:7px 9px; border:1px solid #ccc; border-radius:5px; font-size:14px;
     font-family:inherit; background:#fff; }
  textarea { resize:vertical; }
  .check { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .check input { width:auto; }
  .lockbox { background:#eef4ff; border:1px solid #cdddff; padding:12px 14px; border-radius:6px; margin-top:10px; }
  .stamp { font-family:ui-monospace,Menlo,monospace; color:#134; }
  .btns { display:flex; gap:12px; margin:6px 0 20px; flex-wrap:wrap; }
  button { padding:9px 16px; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer; font-size:14px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #preview { border:1px solid var(--line); border-radius:8px; padding:14px 18px; background:#fff; }
  #preview table { border-collapse:collapse; }
  #preview td { padding:3px 10px 3px 0; vertical-align:top; }
  #preview td.k { color:#555; white-space:nowrap; }
  .foot { color:#888; font-size:12px; margin-top:14px; }
</style>
</head>
<body>
<h1>EEG Study Protocol</h1>
<p class="sub">Declare the study and its planned recording and preprocessing before any data are collected.
Lock the form to timestamp it, then export a structured record to store with the study.
Runs entirely in your browser; nothing is uploaded.</p>

<form id="f"></form>

<fieldset>
  <legend>Rationale</legend>
  <label for="rationale">Notes (brief)</label>
  <textarea id="rationale" rows="3" placeholder="One or two lines on the reasoning, prior work, or a linked pre-registration."></textarea>
  <div class="lockbox">
    <div class="check">
      <input type="checkbox" id="locked">
      <label for="locked" style="margin:0">I confirm this protocol is declared before any data are collected.</label>
    </div>
    <div id="stamp" class="sub" style="margin-top:6px">Not yet locked.</div>
  </div>
</fieldset>

<div class="btns">
  <button type="button" class="primary" onclick="dl('json')">Download protocol (JSON)</button>
  <button type="button" onclick="dl('html')">Download protocol (HTML)</button>
</div>

<h3>Preview</h3>
<div id="preview"></div>
<p class="foot" id="foot"></p>

<script>
const VERSION = "0.3";
const sections = {
  "Study & registration": [
    ["study","Study / paradigm","text",""],
    ["experimenter","Person completing this form","text",""],
    ["date_planned","Date of this declaration","text","YYYY-MM-DD"],
    ["hypothesis","Hypothesis / prediction","area","What effect do you predict, and in which direction?"],
    ["design","Design & conditions","area","e.g., 2x2 within-subject: inclusion vs exclusion x gaze direction"]
  ],
  "Sample & eligibility": [
    ["n_planned","Planned sample size","num",40],
    ["stopping","Sampling / stopping rule","area","e.g., collect until N=40 usable datasets; recruit at most 55"],
    ["inclusion","Inclusion criteria","area","e.g., 18-35, right-handed, normal or corrected vision"],
    ["exclusion","Exclusion criteria","area","e.g., neurological history, prior Cyberball, fewer than the minimum trials"]
  ],
  "Planned recording": [
    ["eeg_system","EEG system & cap","text","e.g., BrainProducts actiCHamp, 22 ch"],
    ["electrode_type","Electrode type","select",["Gel-based","Saline-based","Dry","Other"]],
    ["srate","Sampling rate (Hz)","num",1000],
    ["amp_filters","Amplifier (online) filters","text","e.g., 0.016 to 1000 Hz, or DC"],
    ["rec_ref","Reference at recording","text","e.g., FCz / linked mastoids"],
    ["ground","Ground electrode","text","e.g., FCz, AFz, Fpz"],
    ["component","ERP component(s) of interest","text","e.g., P3b, N400"],
    ["software","Analysis software & version","text","e.g., EEGLAB 2024.2, MNE 1.7"]
  ],
  "Planned preprocessing — filtering": [
    ["hp","High-pass cutoff (Hz)","num",0.1],
    ["lp","Low-pass cutoff (Hz)","num",30],
    ["notch","Notch / line filter","text","e.g., 50 Hz, or none"],
    ["filt_type","Filter type & order","text","e.g., FIR, Hamming, zero-phase"]
  ],
  "Planned preprocessing — referencing & channels": [
    ["reref","Re-reference scheme","select",["Keep recording reference","Average reference","Linked mastoids","REST","Other"]],
    ["badchan","Bad-channel detection","area","Criterion for marking a channel bad (e.g., kurtosis > 5, flat > 5 s)"],
    ["interp","Interpolation method","text","e.g., spherical spline, or none"]
  ],
  "Planned preprocessing — segmentation": [
    ["lock_event","Time-locking event(s)","text","e.g., stimulus onset (S 1/S 2)"],
    ["epoch","Epoch window (ms)","text","e.g., -200 to 800"],
    ["baseline","Baseline window (ms)","text","e.g., -200 to 0"]
  ],
  "Planned preprocessing — artifact correction (ICA)": [
    ["ica_use","Use ICA?","check",true],
    ["ica_algo","ICA algorithm","text","e.g., extended Infomax, AMICA"],
    ["ica_rej","Component rejection rule","area","How components are identified and removed (e.g., ICLabel > 0.8 eye/muscle)"]
  ],
  "Planned preprocessing — artifact rejection": [
    ["rej_method","Trial rejection method","area","e.g., absolute amplitude > 100 uV, or step function"],
    ["rej_thresh","Threshold","text","e.g., 100 uV"],
    ["min_trials","Minimum trials per condition","num",20]
  ],
  "Planned measurement & analysis": [
    ["meas_window","Measurement window (ms)","text","e.g., 300 to 500"],
    ["meas_elec","Electrode(s) / ROI","text","e.g., Pz, POz, CPz"],
    ["meas_type","Measure","select",["Mean amplitude","Peak amplitude","Peak latency","Fractional area latency","Other"]],
    ["stat_plan","Planned statistical test","area","e.g., 2x2 repeated-measures ANOVA on mean amplitude; alpha .05; correction for multiple comparisons"]
  ]
};
const labels = {};
const form = document.getElementById("f");
for (const [sec, fields] of Object.entries(sections)) {
  const fs = document.createElement("fieldset");
  fs.innerHTML = "<legend>"+sec+"</legend>";
  for (const [id,lab,type,extra] of fields) {
    labels[id] = lab;
    const wrap = document.createElement("div");
    if (type==="check") {
      wrap.className="check";
      wrap.innerHTML = `<input type="checkbox" id="${id}" ${extra?"checked":""}><label for="${id}" style="margin:0">${lab}</label>`;
    } else {
      let field="";
      if (type==="text") field=`<input type="text" id="${id}" placeholder="${extra||""}">`;
      else if (type==="num") field=`<input type="number" id="${id}" value="${extra}" step="any">`;
      else if (type==="area") field=`<textarea id="${id}" rows="2" placeholder="${extra||""}"></textarea>`;
      else if (type==="select") field=`<select id="${id}">`+extra.map(o=>`<option>${o}</option>`).join("")+`</select>`+
        `<input type="text" id="${id}__other" placeholder="Type your own…" style="display:none;margin-top:6px">`;
      wrap.innerHTML = `<label for="${id}">${lab}</label>`+field;
    }
    fs.appendChild(wrap);
  }
  form.appendChild(fs);
}

// dropdowns: reveal a text box when "Other" is chosen so people can add their own value
document.querySelectorAll('#f select').forEach(sel => {
  sel.addEventListener('change', () => {
    const o = document.getElementById(sel.id + '__other');
    if (o) { o.style.display = (sel.value === 'Other') ? 'block' : 'none'; if (sel.value !== 'Other') o.value = ''; }
    render();
  });
});

let lockTime = null;
const lockEl = document.getElementById("locked");
const stampEl = document.getElementById("stamp");
lockEl.addEventListener("change", () => {
  if (lockEl.checked && !lockTime) lockTime = new Date().toISOString().replace("T"," ").slice(0,19)+" UTC";
  if (!lockEl.checked) lockTime = null;
  stampEl.innerHTML = lockTime ? ('Locked at <span class="stamp">'+lockTime+'</span>') : "Not yet locked.";
  render();
});

function val(id){ const e=document.getElementById(id); if(!e) return "";
  if(e.tagName==="SELECT"){ const o=document.getElementById(id+"__other"); if(e.value==="Other"&&o&&o.value.trim()) return o.value.trim(); return e.value; }
  return e.type==="checkbox"?e.checked:e.value; }
function collect(){
  const fields={};
  for (const id of Object.keys(labels)) fields[id]=val(id);
  return { protocol_format_version:VERSION, generated:new Date().toISOString().replace("T"," ").slice(0,19)+" UTC",
           declared_before_data_collection:lockEl.checked, locked_at:lockTime, rationale:val("rationale"), fields };
}
function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function reportHTML(d){
  let secs="";
  for (const [sec,fields] of Object.entries(sections)){
    let rows="";
    for (const [id] of fields){
      let v=d.fields[id]; if(v===""||v===false||v==null) v="—"; if(v===true) v="yes";
      rows+=`<tr><td class="k">${labels[id]}</td><td>${esc(v)}</td></tr>`;
    }
    secs+=`<h4 style="margin:14px 0 4px">${sec}</h4><table>${rows}</table>`;
  }
  return `<h2 style="margin-bottom:2px">EEG Study Protocol</h2>`+
    `<p style="color:#666;margin-top:0">Declared before data collection: <b>${d.declared_before_data_collection?"yes":"no"}</b> · `+
    `Locked at: <span class="stamp">${d.locked_at||"not locked"}</span></p>`+secs+
    `<h4 style="margin:14px 0 4px">Rationale</h4><p>${esc(d.rationale||"—")}</p>`+
    `<p style="color:#888;font-size:12px">Protocol format v${d.protocol_format_version} · generated ${d.generated}</p>`;
}
function render(){ document.getElementById("preview").innerHTML = reportHTML(collect()); }
function fname(ext){ let s=val("study")||"study"; s=s.replace(/[^A-Za-z0-9_-]+/g,"-");
  const day=new Date().toISOString().slice(0,10).replace(/-/g,""); return `protocol_${s}_${day}.${ext}`; }
function download(name,text,mime){ const b=new Blob([text],{type:mime}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u); }
function dl(kind){ const d=collect();
  if(kind==="json") download(fname("json"), JSON.stringify(d,null,2), "application/json");
  else download(fname("html"), "<!doctype html><meta charset='utf-8'><title>EEG study protocol</title>"+reportHTML(d), "text/html"); }

form.addEventListener("input", render);
document.getElementById("rationale").addEventListener("input", render);
document.getElementById("foot").textContent = "Protocol format v"+VERSION+" · fields follow ARTEM-IS / COBIDAS-MEEG conventions.";
render();
</script>
</body>
</html>
